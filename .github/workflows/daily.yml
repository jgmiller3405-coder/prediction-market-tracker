name: daily

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      - name: Fetch sources, build history, write status
        run: |
          uv run python pipeline.py fetch
          uv run python pipeline.py build
          uv run python pipeline.py status
      - name: Open today's issue and close the previous one
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python pipeline.py issue
      - name: Commit raw files, history and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily data run $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
